###############################################################################
#  Fork-only ARM Linux lane (echennells). Not generated by libbitcoin-build and
#  not for upstream. Lives on the fork's master so it can be dispatched against
#  any branch without entering that branch's diff:
#    gh workflow run ci-arm.yml --repo echennells/libbitcoin-system \
#      --ref master -f ref=<branch-or-sha>
###############################################################################
name: ARM Linux Integration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "libbitcoin-system branch, tag or sha to build and test"
        required: true
        default: "master"

jobs:
  gnu-arm:
    strategy:
      fail-fast: false

      matrix:
        include:
          - image: ubuntu-24.04-arm
            config: "release"
            link: "static"
            cc: "gcc"
            cxx: "g++"
            package: ""
            boost: "--build-boost"
            secp256k1: "--build-secp256k1"
            options: "--enable-isystem"

          - image: ubuntu-24.04-arm
            config: "debug"
            link: "dynamic"
            cc: "clang"
            cxx: "clang++"
            package: "clang"
            boost: "--build-boost"
            secp256k1: "--build-secp256k1"
            options: "--enable-isystem"

    runs-on: ${{ matrix.image }}

    env:
      CC: '${{ matrix.cc }}'
      CXX: '${{ matrix.cxx }}'

    steps:
      - name: Checkout repository [libbitcoin-system @ ${{ inputs.ref }}]
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          path: 'libbitcoin-system'
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref }}

      - name: Prepare toolchain [linux arm]
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential autoconf automake libtool pkg-config ${{ matrix.package }}
          echo "arch: $(uname -m)"
          ${{ matrix.cxx }} --version | head -1
          echo "tested: $(git -C libbitcoin-system rev-parse HEAD)"

      - name: Environmental Computation
        shell: bash
        run: |
          if [[ "${{ matrix.link }}" == "dynamic" ]]; then
              echo "LDFLAGS=-Wl,-rpath,${{ github.workspace }}/prefix/lib" >> $GITHUB_ENV
          fi

      - name: Execute installation
        shell: bash
        working-directory: 'libbitcoin-system'
        run: >
          ./builds/gnu/install-gnu.sh
          --build-use-local-src
          --build-src-dir="${{ github.workspace }}"
          --prefix="${{ github.workspace }}/prefix"
          --build-post-install-clean
          --build-obj-dir="obj"
          --build-obj-dir-relative
          --build-config="${{ matrix.config }}"
          --build-link="${{ matrix.link }}"
          ${{ matrix.boost }}
          ${{ matrix.secp256k1 }}
          ${{ matrix.options }}

      - name: Test artifact collection
        if: failure()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for f in obj/test-suite.log obj/test.log; do
            [[ -e "libbitcoin-system/$f" ]] && cp "libbitcoin-system/$f" "arm-$(basename $f).errors"
          done
          true

      - name: Test artifact upload
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: arm-testlogs-${{ matrix.cc }}-${{ matrix.config }}
          path: ${{ github.workspace }}/*.errors
          retention-days: 3
